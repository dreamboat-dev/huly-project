x-common-settings: &huly-common-settings
  restart: ${RESTART_POLICY:-unless-stopped}
  volumes:
    - /etc/localtime:/etc/localtime:ro
    - /etc/timezone:/etc/timezone:ro
  networks:
    - huly-net

x-common-env: &huly-common-env
  DB_URL: mongodb://mongodb:27017
  MONGO_URL: mongodb://mongodb:27017
  STORAGE_CONFIG: minio|${MINIO_NAME:-huly-minio}?accessKey=${MINIO_ROOT_USER:-huly}&secretKey=${MINIO_ROOT_PASSWORD:?}
  SECRET: ${HULY_SECRET:-$(openssl rand -hex 32)}
  SERVER_SECRET: ${HULY_SECRET:-$(openssl rand -hex 32)}

x-fulltext-url: &huly-fulltext-url
  FULLTEXT_URL: http://${FULLTEXT_NAME:-huly-fulltext}:4700

x-accounts-url: &huly-accounts-url
  ACCOUNTS_URL: http://${ACCOUNT_NAME:-huly-account}:3000

x-stats-url: &huly-stats-url
  STATS_URL: http://${STATS_NAME:-huly-stats}:4900

x-last-name-first: &huly-last-name-first
  LAST_NAME_FIRST: ${LAST_NAME_FIRST:-true}

x-transactor-url: &huly-transactor-url
  TRANSACTOR_URL: ws://${TRANSACTOR_NAME:-huly-transactor}:3333;ws${SECURE:+s}://${HOST_ADDRESS}/_transactor

x-elastic-urls: &huly-elastic-urls
  ELASTIC_URL: http://${ELASTIC_NAME:-huly-elastic}:9200
  FULLTEXT_DB_URL: http://${ELASTIC_NAME:-huly-elastic}:9200

x-endpoints: &huly-endpoints
  LOVE_ENDPOINT: http${SECURE:+s}://${HOST_ADDRESS}/_love
  ACCOUNTS_URL: http${SECURE:+s}://${HOST_ADDRESS}/_accounts
  REKONI_URL: http${SECURE:+s}://${HOST_ADDRESS}/_rekoni
  CALENDAR_URL: http${SECURE:+s}://${HOST_ADDRESS}/_calendar
  GMAIL_URL: http${SECURE:+s}://${HOST_ADDRESS}/_gmail
  TELEGRAM_URL: http${SECURE:+s}://${HOST_ADDRESS}/_telegram
  STATS_URL: http${SECURE:+s}://${HOST_ADDRESS}/_stats
  COLLABORATOR_URL: ws${SECURE:+s}://${HOST_ADDRESS}/_collaborator
  UPLOAD_URL: /files

services:
  rekoni:
    image: hardcoreeng/rekoni-service:${HULY_IMAGE_TAG:-v0.6.501}
    container_name: ${REKONI_NAME:-huly-rekoni}
    hostname: ${REKONI_NAME:-huly-rekoni}
    <<: [*huly-common-settings]
    environment:
      <<: [*huly-common-env]

  transactor:
    image: hardcoreeng/transactor:${HULY_IMAGE_TAG:-v0.6.501}
    container_name: ${TRANSACTOR_NAME:-huly-transactor}
    hostname: ${TRANSACTOR_NAME:-huly-transactor}
    <<: [*huly-common-settings]
    environment:
      <<: [*huly-common-env, *huly-stats-url, *huly-fulltext-url, *huly-accounts-url, *huly-last-name-first]
      SERVER_PORT: 3333
      SERVER_CURSOR_MAXTIMEMS: 30000
      FRONT_URL: http://localhost:8087

  collaborator:
    image: hardcoreeng/collaborator:${HULY_IMAGE_TAG:-v0.6.501}
    container_name: ${COLLABORATOR_NAME:-huly-collaborator}
    hostname: ${COLLABORATOR_NAME:-huly-collaborator}
    <<: [*huly-common-settings]
    environment:
      <<: [*huly-common-env, *huly-stats-url, *huly-accounts-url]
      COLLABORATOR_PORT: 3078

  account:
    image: hardcoreeng/account:${HULY_IMAGE_TAG:-v0.6.501}
    container_name: ${ACCOUNT_NAME:-huly-account}
    hostname: ${ACCOUNT_NAME:-huly-account}
    <<: [*huly-common-settings]
    environment:
      <<: [*huly-common-env, *huly-stats-url, *huly-transactor-url]
      FRONT_URL: http://${FRONT_NAME:-huly-front}:8080
      MODEL_ENABLED: "*"
      ACCOUNTS_URL: http://localhost:3000
      SERVER_PORT: 3000
      ACCOUNT_PORT: 3000
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}

  workspace:
    image: hardcoreeng/workspace:${HULY_IMAGE_TAG:-v0.6.501}
    container_name: ${WORKSPACE_NAME:-huly-workspace}
    hostname: ${WORKSPACE_NAME:-huly-workspace}
    <<: [*huly-common-settings]
    environment:
      <<: [*huly-common-env, *huly-stats-url, *huly-fulltext-url, *huly-accounts-url, *huly-transactor-url]

  front:
    image: hardcoreeng/front:${HULY_IMAGE_TAG:-v0.6.501}
    container_name: ${FRONT_NAME:-huly-front}
    hostname: ${FRONT_NAME:-huly-front}
    <<: [*huly-common-settings]
    environment:
      <<: [*huly-common-env, *huly-last-name-first, *huly-elastic-urls, *huly-endpoints]
      SERVER_PORT: 8080
      TITLE: ${TITLE:-Huly Self Host}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
      DESKTOP_UPDATES_CHANNEL: selfhost
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}

  fulltext:
    image: hardcoreeng/fulltext:${HULY_IMAGE_TAG:-v0.6.501}
    container_name: ${FULLTEXT_NAME:-huly-fulltext}
    hostname: ${FULLTEXT_NAME:-huly-fulltext}
    <<: [*huly-common-settings]
    environment:
      <<: [*huly-common-env, *huly-accounts-url, *huly-stats-url, *huly-elastic-urls]
      ELASTIC_INDEX_NAME: huly_storage_index
      REKONI_URL: http://${REKONI_NAME:-huly-rekoni}:4004
    depends_on:
      - elastic

  stats:
    image: hardcoreeng/stats:${HULY_IMAGE_TAG:-v0.6.501}
    container_name: ${STATS_NAME:-huly-stats}
    hostname: ${STATS_NAME:-huly-stats}
    <<: [*huly-common-settings]
    environment:
      <<: [*huly-common-env]
      PORT: 4900
